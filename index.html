<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vidora AI</title>
    <style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    height: 100vh;
}

.app {
    display: flex;
    height: 100vh;
}


/* SIDEBAR */

.sidebar {
    width: 230px;
    background: #091525;
    padding: 20px 15px;
    border-right: 1px solid #20324a;
}

.sidebar h2 {
    margin-bottom: 25px;
}

.sidebar button {
    width: 100%;
    padding: 12px;
    margin: 4px 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #cbd5e1;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.sidebar button:hover {
    background: #172b55;
    color: white;
}


/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}


/* HEADER */

header {
    height: 65px;
    padding: 20px;
    border-bottom: 1px solid #20324a;
    background: #081321;
    font-size: 22px;
}

header span {
    color: #38bdf8;
}


/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    text-align: center;
    margin: 15px auto 25px;
}

.welcome h1 {
    font-size: 30px;
}

.welcome h1 span {
    color: #38bdf8;
}

.welcome p {
    color: #94a3b8;
    margin-top: 8px;
}


/* CARDS */

.quick-cards {
    max-width: 800px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.card {
    background: #0d1c2e;
    border: 1px solid #29415d;
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
}

.card:hover {
    border-color: #38bdf8;
}

.card b {
    display: block;
    margin-top: 10px;
}


/* MESSAGE */

.message {
    max-width: 800px;
    margin: 25px auto;
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.message div {
    background: #122235;
    border: 1px solid #263d57;
    padding: 14px;
    border-radius: 14px;
}


/* INPUT */

.input-area {
    display: flex;
    gap: 7px;
    padding: 12px 20px 18px;
    background: #07111f;
}

.input-area button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 12px;
    background: #122235;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.input-area button:hover {
    background: #1b304b;
}

#userInput {
    flex: 1;
    border: 1px solid #405574;
    border-radius: 14px;
    background: #0d1b2d;
    color: white;
    padding: 12px;
    outline: none;
    font-size: 15px;
}


/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .quick-cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .chat {
        padding: 15px;
    }

    .input-area {
        padding: 8px;
    }

}

</style>

</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <h2>🎓 Vidora AI</h2>

            <button>🏠 New Chat</button>
            <button>📚 BPSC Study</button>
            <button onclick="openFilePicker()">📄 Upload PDF</button>
            <button>🖼️ Image Analysis</button>
            <button>🎙️ Voice Assistant</button>
            <button>📝 MCQ & Quiz</button>
            <button>📅 Study Planner</button>
            <button>⚙️ Settings</button>

        </aside>


        <main class="main">

            <header>
                <b>Vidora <span>AI</span></b>
            </header>


            <div class="chat" id="chatBox">

                <div class="welcome">

                    <h1>
                        Welcome to Vidora AI
                    </h1>

                    <p>
                        आपका AI Study Assistant
                    </p>

                </div>


                <div class="quick-cards">

                    <div class="card">
                        📚
                        <b>BPSC Study</b>
                    </div>

                    <div class="card">
                        📄
                        <b>Upload PDF</b>
                    </div>

                    <div class="card">
                        🖼️
                        <b>Image Analysis</b>
                    </div>

                    <div class="card">
                        📝
                        <b>MCQ & Quiz</b>
                    </div>

                </div>


                <div class="message">

                    🤖

                    <div>
                        नमस्ते! 👋
                        <br><br>
                        मैं <b>Vidora AI</b> हूँ।
                        आपका AI Study Assistant।
                    </div>

                </div>

            </div>


            <div class="input-area">

                <button>📷</button>

                <button onclick="openFilePicker()">📎</button>

<input
    type="file"
    id="fileInput"
    accept=".pdf"
    style="display:none"
    onchange="handleFile(event)"
>

                <input
                    type="text"
                    id="userInput"
                    placeholder="Vidora AI से कुछ पूछें..."
                >

                <button>➤</button>

            </div>

        </main>

    </div>

    <script>


async function sendMessage() {

    const input = document.getElementById("userInput");
    const fileInput = document.getElementById("fileInput");

    const message = input.value.trim();
    const file = fileInput.files[0];

    if (message === "" && !file) {
        return;
    }

    addMessage(
        message || "📎 PDF भेजी गई",
        "user"
    );

    input.value = "";

    let fileData = null;
    let fileName = null;

    if (file) {

        fileName = file.name;

        fileData = await new Promise((resolve) => {

            const reader = new FileReader();

            reader.onload = () => {
                resolve(reader.result.split(",")[1]);
            };

            reader.readAsDataURL(file);
        });
    }

    try {

        const response = await fetch(
            "http://localhost:3000/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message,
                    fileData: fileData,
                    fileName: fileName
                })
            }
        );

        const data = await response.json();

        addMessage(data.reply, "ai");

        fileInput.value = "";

    } catch (error) {

        console.error(error);

        addMessage(
            "PDF भेजने में समस्या हुई।",
            "ai"
        );
    }
}

function addMessage(text, sender) {

    const chatBox = document.getElementById("chatBox");

    const message = document.createElement("div");

    message.className =
        sender === "user"
        ? "message user-row"
        : "message";

    const avatar = document.createElement("div");

    avatar.className =
        sender === "user"
        ? "avatar user-avatar"
        : "avatar ai-avatar";

    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";

    const content = document.createElement("div");

    content.className =
        sender === "user"
        ? "message-content user-message"
        : "message-content ai-message";

    content.textContent = text;

    message.appendChild(avatar);
    message.appendChild(content);

    chatBox.appendChild(message);

    chatBox.scrollTop = chatBox.scrollHeight;
}

document
    .getElementById("userInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

    function openFilePicker() {
    document.getElementById("fileInput").click();
}

function handleFile(event) {
    const file = event.target.files[0];

    if (!file) {
        return;
    }

    console.log("PDF चुना गया:", file.name);
}
    </script>

</body>

</html>
